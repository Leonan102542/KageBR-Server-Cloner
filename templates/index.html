<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KageBR Server Cloner</title>
    <style>
        :root {
            --bg-main: #1e1f22;
            --bg-card: #2b2d31;
            --bg-input: #111214;
            --blurple: #5865F2;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --success: #23a55a;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        h1 { text-align: center; color: var(--blurple); margin: 0 0 5px 0; font-size: 26px; font-weight: 800; }
        p.subtitle { text-align: center; color: var(--text-muted); margin-top: 0; margin-bottom: 30px; font-size: 14px; }
        label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid transparent; background-color: var(--bg-input); color: #ffffff; box-sizing: border-box; font-size: 15px; margin-bottom: 20px; }
        input:focus { border-color: var(--blurple); outline: none; }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; background-color: var(--blurple); color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Área de Estatísticas e Progresso */
        .loader-container { display: none; text-align: center; margin-top: 10px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid var(--blurple); border-radius: 50%; margin: 0 auto 20px auto; animation: spin 1s linear infinite; }
        
        .progress-bar-bg { width: 100%; background-color: var(--bg-input); height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 15px; }
        .progress-bar-fill { width: 0%; background-color: var(--blurple); height: 100%; transition: width 0.3s ease; }
        
        .stat-text { color: var(--text-main); font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .status-msg { color: var(--text-muted); font-size: 13px; font-style: italic; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <h1>KageBR Cloner</h1>
        <p class="subtitle">Acompanhe a cópia dos canais em tempo real</p>
        
        <!-- CORRIGIDO: Removido o interceptador complexo e retornado ao envio nativo simplificado -->
        <form id="cloner-form" action="/clonar" method="POST" onsubmit="mostrarCarregando()">
            <label>Token de Autenticação</label>
            <input type="password" name="token" id="token" required placeholder="Insira seu Token do Discord">

            <label>ID do Servidor de Origem</label>
            <input type="text" name="origem" id="origem" required placeholder="ID do servidor original">

            <label>ID do Servidor de Destino</label>
            <input type="text" name="destino" id="destino" required placeholder="ID do servidor vazio">

            <button type="submit">Iniciar Clonagem Avançada</button>
        </form>

        <!-- Painel de Carregamento Fixo -->
        <div class="loader-container" id="loading-area">
            <div class="spinner" id="main-spinner"></div>
            <div class="stat-text" id="contador-texto">Clonagem em Andamento...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="barra-progresso" style="width: 50%;"></div>
            </div>
            <div class="status-msg" id="status-atual">O Discord está processando os novos canais em segundo plano. Verifique seu aplicativo do Discord!</div>
        </div>
    </div>

    <script>
        function mostrarCarregando() {
            // Essa função roda instantaneamente na tela quando você clica no botão, sem travar
            document.getElementById('cloner-form').style.display = 'none';
            document.getElementById('loading-area').style.display = 'block';
            
            // Inicia um monitoramento visual simples para simular o progresso enquanto roda no servidor
            let barra = document.getElementById('barra-progresso');
            let texto = document.getElementById('status-atual');
            let largura = 10;
            
            setInterval(() => {
                if (largura < 95) {
                    largura += 5;
                    barra.style.width = largura + '%';
                }
            }, 2000);
        }
    </script>
</body>
</html>
